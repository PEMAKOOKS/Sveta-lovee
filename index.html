<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Света, я тебя люблю ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% 20%, #fff0f5, #ffd6e5 45%, #ffb3cc);
      overflow: hidden;
    }
    .card {
      width: min(92vw, 560px); padding: 55px 28px; text-align: center;
      background: rgba(255,255,255,.78); border-radius: 32px;
      box-shadow: 0 20px 60px rgba(130,30,70,.18);
      backdrop-filter: blur(12px);
    }
    h1 { margin: 0 0 34px; font-size: clamp(34px, 8vw, 62px); color: #c2185b; }
    button {
      border: 0; border-radius: 999px; padding: 18px 30px;
      font-size: 19px; font-weight: 700; color: white; background: #e91e63;
      cursor: pointer; box-shadow: 0 10px 25px rgba(233,30,99,.3);
      transition: transform .15s, box-shadow .15s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(233,30,99,.38); }
    button:active { transform: translateY(1px); }
    #status { min-height: 24px; margin-top: 18px; color: #8a3155; }
    .heart { position: fixed; bottom: -30px; animation: rise 5s linear forwards; pointer-events:none; }
    @keyframes rise {
      from { transform: translateY(0) scale(.7); opacity: 0; }
      10% { opacity: .9; }
      to { transform: translateY(-110vh) scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Света, я тебя люблю ❤️</h1>
    <form action="https://formsubmit.co/Pavelmasisev266@gmail.com" method="POST" id="loveForm">
      <input type="hidden" name="_subject" value="💗 Света нажала «Я тебя тоже люблю»">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="message" value="Света нажала кнопку «Я тебя тоже люблю» на сайте. ❤️">
      <button type="submit">Я тебя тоже люблю 💕</button>
    </form>
    <div id="status"></div>
  </main>

  <script>
    document.getElementById('loveForm').addEventListener('submit', function () {
      document.getElementById('status').textContent = '❤️ Сообщение отправляется…';
      for (let i = 0; i < 14; i++) {
        const h = document.createElement('div');
        h.className = 'heart';
        h.textContent = ['❤️','💕','💗','💖'][Math.floor(Math.random()*4)];
        h.style.left = Math.random()*100 + 'vw';
        h.style.fontSize = (18 + Math.random()*24) + 'px';
        h.style.animationDelay = (Math.random()*.7) + 's';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 6000);
      }
    });
  </script>
</body>
</html>
